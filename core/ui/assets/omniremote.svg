<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="vector-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% PURE TRANSPARENT BACKGROUND (ZERO BOX / ZERO CUBE) -->
  <g transform="translate(256, 256)">
    <!-- Top-Right Sweeping Orbit Arc -->
    <path d="M -90 -150 A 175 175 0 0 1 150 90" 
          fill="none" 
          stroke="url(#neon-cyan)" 
          stroke-width="40" 
          stroke-linecap="round"
          filter="url(#vector-glow)"/>

    <!-- Bottom-Left Sweeping Orbit Arc -->
    <path d="M 90 150 A 175 175 0 0 1 -150 -90" 
          fill="none" 
          stroke="url(#neon-blue)" 
          stroke-width="40" 
          stroke-linecap="round"
          filter="url(#vector-glow)"/>

    <!-- Dynamic Tilted Pointer Cursor (20deg tilt) -->
    <g transform="rotate(-20) translate(0, -5)">
      <path d="M 0 -85 L 60 60 L 0 32 L -60 60 Z" 
            fill="url(#neon-cyan)" 
            stroke="#00f2fe" 
            stroke-width="4" 
            stroke-linejoin="round"
            filter="url(#vector-glow)"/>
      <circle cx="0" cy="5" r="11" fill="#ffffff"/>
    </g>
  </g>
</svg>
