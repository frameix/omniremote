<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Cyan to Electric Blue Accent Gradient -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#4facfe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#border-glow)" stroke-width="4"/>

  <!-- Phone / Remote Silhouette with Glassmorphism Border -->
  <rect x="136" y="96" width="240" height="320" rx="36" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="2.5"/>

  <!-- Trackpad Surface Area inside Phone -->
  <rect x="156" y="140" width="200" height="200" rx="24" fill="rgba(0, 242, 254, 0.05)" stroke="rgba(79, 172, 254, 0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Wireless / Signal Ripple Arcs -->
  <path d="M 216 116 A 40 40 0 0 1 296 116" fill="none" stroke="url(#cyan-blue)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 200 102 A 56 56 0 0 1 312 102" fill="none" stroke="url(#cyan-blue)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" filter="url(#soft-glow)"/>

  <!-- Touch Point Ripple Waves (Central Haptic Point) -->
  <circle cx="256" cy="236" r="54" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="236" r="36" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="236" r="20" fill="none" stroke="#00f2fe" stroke-width="3.5" opacity="0.9" filter="url(#soft-glow)"/>
  
  <!-- Glowing Touch Core Dot -->
  <circle cx="256" cy="236" r="10" fill="url(#cyan-blue)" filter="url(#glow)"/>
  <circle cx="256" cy="236" r="5" fill="#ffffff"/>

  <!-- Bottom Physical Click Indicator Bar -->
  <rect x="176" y="360" width="70" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)"/>
  <rect x="266" y="360" width="70" height="8" rx="4" fill="url(#cyan-blue)" opacity="0.8"/>
</svg>
