<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg3)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="2.5"/>

  <!-- Iconic Pure Touchpad / Cursor Symbol -->
  <!-- Radiating Wi-Fi / Remote Waves -->
  <path d="M 146 160 A 155 155 0 0 1 366 160" fill="none" stroke="url(#grad3)" stroke-width="22" stroke-linecap="round" opacity="0.3"/>
  <path d="M 186 200 A 100 100 0 0 1 326 200" fill="none" stroke="url(#grad3)" stroke-width="22" stroke-linecap="round" opacity="0.7"/>
  <path d="M 226 240 A 45 45 0 0 1 286 240" fill="none" stroke="#00f2fe" stroke-width="22" stroke-linecap="round" filter="url(#glow3)"/>

  <!-- Sleek Modern Cursor Arrow intersecting from bottom -->
  <path d="M 256 250 L 310 370 L 256 345 L 202 370 Z" 
        fill="url(#grad3)" 
        stroke="#05070a" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#glow3)"/>
  <circle cx="256" cy="275" r="8" fill="#ffffff"/>
</svg>
